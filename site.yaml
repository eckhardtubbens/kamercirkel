site:
  name: "Kamercirkel"
  tagline: "Open podium voor kamermuziek"
  city: "Amsterdam"

  description: >
    Kamercirkel is een open podium voor klassieke kamermuziek in Amsterdam.
    Een plek voor ensembles, professionele musici, conservatoriumstudenten
    en gevorderde amateurs om kamermuziek te spelen, te luisteren en andere
    musici te ontmoeten en deel uit te maken van een muzikale community.

  url: "https://kamercirkel.nl"
  email: "info@kamercirkel.nl"

