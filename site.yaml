  text:
    introduction: >
      Kamercirkel is een open podium voor klassieke kamermuziek.
      Voor ensembles die hun muziek graag voor publiek spelen,
      in welke fase van hun muzikale leven dan ook.
  
    musicians: >
      Heb je een ensemble en wil je graag spelen?
      Neem je muziek mee. Ook ensembles met piano zijn welkom:
      in de grote zaal staat een vleugel.
  
    listeners: >
      Nog geen ensemble? Kom luisteren en ontmoet andere musici.
      Misschien ontstaat er ter plekke wel een nieuw ensemble.
      Luisteraars zijn natuurlijk ook welkom.
  playing:
    registration: "Ter plekke inschrijven"
    time: "De beschikbare speeltijd hangt af van de animo."

